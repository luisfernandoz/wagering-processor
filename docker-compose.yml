version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres
    environment:
      POSTGRES_USER: wagering_user
      POSTGRES_PASSWORD: wagering_password
      POSTGRES_DB: wagering_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wagering_user -d wagering_db']
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    container_name: wagering-localstack
    ports:
      - '4566:4566'
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - './scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-aws.sh'

volumes:
  postgres_data:
